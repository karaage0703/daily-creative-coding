<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fire Works</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      font-size: 14px;
      z-index: 100;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <div id="controls">
    <p>🎆 SPECTACULAR FIREWORKS SHOW 🎆</p>
    <p>Click: Launch firework | SPACE: Explode all</p>
    <p>1: MEGA Blast | 2: Rainbow | 3: Chrysanthemum</p>
    <p>4: Crossette | 5: ULTIMATE FINALE</p>
    <p>A: Toggle auto-launch</p>
  </div>
</body>
</html>
